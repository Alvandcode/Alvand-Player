name: Android CI – Build Alvand Player

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          ls -la
          if [ ! -f gradlew ]; then
            echo "gradlew not found, generating wrapper"
            gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ALVAND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "${{ runner.temp }}/alvand-release.keystore"
          else
            echo "No keystore secret - release will be debug-signed"
          fi

      - name: Show keystore aliases (safe debug info)
        env:
          KS_B64: ${{ secrets.ALVAND_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ALVAND_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            keytool -list -keystore "${{ runner.temp }}/alvand-release.keystore" -storepass "$KS_PASS"
          else
            echo "Skipped (no keystore secret)"
          fi

      - name: Build signed Release (APK + AAB)
        env:
          ALVAND_KEYSTORE_PATH: ${{ runner.temp }}/alvand-release.keystore
          ALVAND_KEYSTORE_PASSWORD: ${{ secrets.ALVAND_KEYSTORE_PASSWORD }}
          ALVAND_KEY_ALIAS: ${{ secrets.ALVAND_KEY_ALIAS }}
          ALVAND_KEY_PASSWORD: ${{ secrets.ALVAND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload Release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # ۱) پوش تگ v* (مثلا v1.0.0) → ریلیز نسخه‌دار
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true

      # ۲) بعد از هر بیلد موفق (به‌جز PR) → ریلیز شناور Latest خودکار ساخته/به‌روز می‌شود
      - name: Update rolling Latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
