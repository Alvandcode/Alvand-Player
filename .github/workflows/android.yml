name: Android CI – Build Alvand Player

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          ls -la
          if [ ! -f gradlew ]; then
            echo "gradlew not found, generating wrapper"
            gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ALVAND_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 --decode > "${{ runner.temp }}/alvand-release.keystore"
          else
            echo "No keystore secret - APKs will be debug-signed with an ephemeral key (updates won't install over each other!)"
          fi

      - name: Build Debug APK (stable-signed, installs over previous builds)
        env:
          ALVAND_KEYSTORE_PATH: ${{ runner.temp }}/alvand-release.keystore
          ALVAND_KEYSTORE_PASSWORD: ${{ secrets.ALVAND_KEYSTORE_PASSWORD }}
          ALVAND_KEY_ALIAS: ${{ secrets.ALVAND_KEY_ALIAS }}
          ALVAND_KEY_PASSWORD: ${{ secrets.ALVAND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Show keystore aliases (safe debug info)
        env:
          KS_B64: ${{ secrets.ALVAND_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ALVAND_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            keytool -list -keystore "${{ runner.temp }}/alvand-release.keystore" -storepass "$KS_PASS"
          else
            echo "Skipped (no keystore secret)"
          fi

      - name: Build signed Release (APK + AAB)
        env:
          ALVAND_KEYSTORE_PATH: ${{ runner.temp }}/alvand-release.keystore
          ALVAND_KEYSTORE_PASSWORD: ${{ secrets.ALVAND_KEYSTORE_PASSWORD }}
          ALVAND_KEY_ALIAS: ${{ secrets.ALVAND_KEY_ALIAS }}
          ALVAND_KEY_PASSWORD: ${{ secrets.ALVAND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # بررسی اینکه هر دو APK با یک گواهی امضا شده‌اند (شرط نصب روی هم)
      # فقط اطلاعاتی است و هرگز نباید جلوی آپلود/ریلیز را بگیرد
      - name: Verify APK signatures match
        continue-on-error: true
        run: |
          BT=$(echo "$ANDROID_HOME"/build-tools/* | tr ' ' '\n' | sort -V | tail -n1)
          echo "debug:"; "$BT/apksigner" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -E "Verified|SHA-256" | head -n 3 || true
          echo "release:"; "$BT/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | grep -E "Verified|SHA-256" | head -n 3 || true

      - name: Upload Release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # ۱) پوش تگ v* (مثلا v1.1.0) → ریلیز نسخه‌دار با یادداشت CHANGELOG
      - name: Extract release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          awk 'BEGIN{c=0} /^## \[/{c++} c==1{print} c==2{exit}' CHANGELOG.md > release-notes.md || true
          if [ ! -s release-notes.md ]; then cp CHANGELOG.md release-notes.md; fi
          cat release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          body_path: release-notes.md
          generate_release_notes: true

      # ۲) بعد از هر بیلد موفق (به‌جز PR) → ریلیز شناور Latest خودکار ساخته/به‌روز می‌شود
      - name: Update rolling Latest release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
