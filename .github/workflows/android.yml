name: Android CI – Build Alvand Player

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: |
          ls -la
          if [ ! -f gradlew ]; then
            echo "gradlew not found, generating wrapper"
            gradle wrapper --gradle-version 8.7 || true
          fi
          chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Decode release keystore
        if: ${{ secrets.ALVAND_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ALVAND_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/alvand-release.keystore"

      - name: Show keystore aliases (safe debug info)
        if: ${{ secrets.ALVAND_KEYSTORE_BASE64 != '' }}
        run: keytool -list -keystore "${{ runner.temp }}/alvand-release.keystore" -storepass "${{ secrets.ALVAND_KEYSTORE_PASSWORD }}"

      - name: Build signed Release (APK + AAB)
        env:
          ALVAND_KEYSTORE_PATH: ${{ runner.temp }}/alvand-release.keystore
          ALVAND_KEYSTORE_PASSWORD: ${{ secrets.ALVAND_KEYSTORE_PASSWORD }}
          ALVAND_KEY_ALIAS: ${{ secrets.ALVAND_KEY_ALIAS }}
          ALVAND_KEY_PASSWORD: ${{ secrets.ALVAND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload Release APK (signed)
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-release-aab
          path: app/build/outputs/bundle/release/*.aab

      # با پوش تگ v* (مثلا v1.0.0) فایل‌ها می‌روند توی GitHub Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
