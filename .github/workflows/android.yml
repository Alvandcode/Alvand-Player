name: Android CI – Build Alvand Player

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v1.6.8'
        required: true
        type: string

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace --console=plain

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace --console=plain

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --console=plain

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-test-reports
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-debug-apk
          if-no-files-found: error
          path: app/build/outputs/apk/debug/*.apk

  release:
    name: Signed release
    needs: quality
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36 packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Gradle wrapper
        run: |
          test -f gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Decode release keystore
        env:
          KS_B64: ${{ secrets.ALVAND_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::ALVAND_KEYSTORE_BASE64 is required"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 --decode > "${{ runner.temp }}/alvand-release.keystore"
          chmod 600 "${{ runner.temp }}/alvand-release.keystore"
          test -s "${{ runner.temp }}/alvand-release.keystore"

      - name: Validate version and changelog
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "::error::Release tag must look like v1.6.8"; exit 1 ;;
          esac
          TAG="${RELEASE_TAG#v}"
          VERSION=$(grep -m1 'appVersionName = ' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VERSION_CODE=$(grep -m1 'appVersionCode = ' app/build.gradle.kts | sed -E 's/.*=[[:space:]]*([0-9]+).*/\1/')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag v$TAG does not match appVersionName $VERSION"
            exit 1
          fi
          if ! printf '%s' "$VERSION_CODE" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::appVersionCode is missing or invalid"
            exit 1
          fi
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no release section for $VERSION"
            exit 1
          fi

      - name: Build signed release
        env:
          ALVAND_KEYSTORE_PATH: ${{ runner.temp }}/alvand-release.keystore
          ALVAND_KEYSTORE_PASSWORD: ${{ secrets.ALVAND_KEYSTORE_PASSWORD }}
          ALVAND_KEY_ALIAS: ${{ secrets.ALVAND_KEY_ALIAS }}
          ALVAND_KEY_PASSWORD: ${{ secrets.ALVAND_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace --console=plain

      - name: Verify release signatures
        env:
          EXPECTED_CERT_SHA256: ${{ vars.ALVAND_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Repository variable ALVAND_RELEASE_CERT_SHA256 is required"
            exit 1
          fi
          BUILD_TOOLS=$(echo "$ANDROID_HOME"/build-tools/* | tr ' ' '\n' | sort -V | tail -n 1)
          RELEASE_APK=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          RELEASE_AAB=$(find app/build/outputs/bundle/release -name '*.aab' -type f | head -n 1)
          test -n "$RELEASE_APK"
          test -n "$RELEASE_AAB"
          normalize_sha() {
            printf '%s' "$1" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]'
          }
          EXPECTED_SHA=$(normalize_sha "$EXPECTED_CERT_SHA256")
          RELEASE_SHA=$(normalize_sha "$("$BUILD_TOOLS/apksigner" verify --print-certs "$RELEASE_APK" | grep -m1 'SHA-256' | sed -E 's/.*:[[:space:]]*//')")
          if [ -z "$EXPECTED_SHA" ] || [ "$RELEASE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Release APK certificate does not match ALVAND_RELEASE_CERT_SHA256"
            exit 1
          fi
          jarsigner -verify "$RELEASE_AAB" >/dev/null
          if ! keytool -printcert -jarfile "$RELEASE_AAB" | tr -d '[:space:]:' | tr '[:lower:]' '[:upper:]' | grep -Fq "$EXPECTED_SHA"; then
            echo "::error::Release AAB certificate does not match ALVAND_RELEASE_CERT_SHA256"
            exit 1
          fi
          mkdir -p release-bundle
          cp "$RELEASE_APK" "$RELEASE_AAB" release-bundle/
          cp release-notes.md release-bundle/
          if [ -f app/build/outputs/mapping/release/mapping.txt ]; then
            cp app/build/outputs/mapping/release/mapping.txt release-bundle/
          fi
          (
            cd release-bundle
            sha256sum ./*.apk ./*.aab ./mapping.txt > SHA256SUMS 2>/dev/null || sha256sum ./*.apk ./*.aab > SHA256SUMS
          )

      - name: Upload verified release bundle
        uses: actions/upload-artifact@v4
        with:
          name: alvand-player-release-bundle
          if-no-files-found: error
          path: release-bundle/

      - name: Create GitHub release
        if: startsWith(inputs.tag, 'v')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          tag_name: ${{ inputs.tag }}
          files: release-bundle/*
          body_path: release-notes.md
          generate_release_notes: false

      - name: Remove release keystore
        if: always()
        run: rm -f "${{ runner.temp }}/alvand-release.keystore"
